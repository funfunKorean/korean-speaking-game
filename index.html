<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 · 어디에 가요?</title>
<style>
:root {
  --ink: #344f49; --muted: #75867b; --line: #dde4d9; --green: #467566;
  --highlight-green: #eaf5eb;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f7f8f2; color: var(--ink); font-family: "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input { font: inherit; }
button { cursor: pointer; }
main { max-width: 1640px; margin: auto; padding: 20px 26px 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
.kicker { font-size: 11px; letter-spacing: .15em; color: #8c9c8b; margin-bottom: 5px; font-weight: 700; }
h1 { font-size: clamp(23px, 2.7vw, 36px); margin: 0; letter-spacing: -.05em; }
h1 span { color: #7d927b; }
.settings { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

/* 모드 선택 UI */
.mode-toggle { display: flex; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mode-toggle label { padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; border-right: 1px solid var(--line); color: var(--muted); margin: 0; }
.mode-toggle label:last-child { border-right: none; }
.mode-toggle input { display: none; }
.mode-toggle input:checked + span { color: var(--green); font-weight: 800; }
.mode-toggle label:has(input:checked) { background: #edf2e8; }

.small { border: 1px solid var(--line); background: #fffdf8; color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; }
.map-frame { border: 1px solid #dce3d5; border-radius: 20px; overflow: hidden; background: #f1f4e7; }
.map-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #aabda9 #eaf0e2; }
.town-wrap { min-width: 1100px; }
#town { display: block; width: 100%; height: auto; }
#town text { font-family: "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }

/* 간판 효과 및 모드별 텍스트 숨김 제어 */
.sign-face { transition: filter 0.3s, stroke 0.3s, transform 0.3s; transform-box: fill-box; transform-origin: center; }
.destination.active .sign-face, .destination.revealed .sign-face {
  stroke: #fff; stroke-width: 6;
  transform: scale(1.15);
}
.destination.active .sign-face {
  filter: drop-shadow(0 0 12px rgba(231,182,68,0.9));
  animation: shine 1.5s ease-in-out infinite alternate;
}
.destination.revealed .sign-face {
  filter: drop-shadow(0 0 16px rgba(231,182,68,1));
}
.destination.active .spark { display: block; animation: pop 0.4s ease-out; }

body.mode-icon .place-name, body.mode-listen .place-name { opacity: 0; }
body.mode-icon .destination.revealed .place-name, 
body.mode-listen .destination.revealed .place-name { opacity: 1; transition: opacity 0.3s; }


/* 목표 지점: 빨간색·흰색 이중 테두리와 움직이는 화살표 */
.destination .target-marker { display: none; pointer-events: none; }
.destination.active .target-marker,
.destination.revealed .target-marker { display: block; }
.target-outline-white { fill: none; stroke: #fff; stroke-width: 11; }
.target-outline-red { fill: none; stroke: #ec1731; stroke-width: 6; }
.target-arrow { fill: #ec1731; stroke: #fff; stroke-width: 3; stroke-linejoin: round; animation: target-bounce 0.85s ease-in-out infinite alternate; }
@keyframes target-bounce { from { transform: translateY(-9px); } to { transform: translateY(2px); } }
@media (prefers-reduced-motion: reduce) { .target-arrow { animation: none; } }

/* 캐릭터 관련 */
.person { transform-box: fill-box; transform-origin: center bottom; transition: transform 0.15s ease-out; transform: scale(1.25); }
.person-shadow { fill: #3a4d45; opacity: 0.25; transition: transform 0.15s; }
.facing-left .person { transform: scale(1.25) scaleX(-1); }
.walking .person { animation: walk 0.25s infinite alternate; }

@keyframes shine { to { filter: drop-shadow(0 0 16px rgba(231,182,68,1)) brightness(1.1); } }
@keyframes walk { to { transform: scale(1.25) translateY(-4px); } }
.facing-left.walking .person { animation: walk-left 0.25s infinite alternate; }
@keyframes walk-left { to { transform: scale(1.25) scaleX(-1) translateY(-4px); } }
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.panel { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; padding: 20px 6px 12px; }
.status { font-size: 15px; font-weight: 600; margin-bottom: 8px; transition: color 0.3s; }
.status.state-a { color: #8c9c8b; }
.status.state-b { color: #d97736; }
.status.state-c { color: var(--green); }
.question { font-size: clamp(26px, 2.8vw, 36px); font-weight: 800; letter-spacing: -.045em; min-height: 52px; display: flex; align-items: center; }

.question { cursor: pointer; }
.answer-card { background: var(--highlight-green); color: #1e4537; padding: 6px 20px; border-radius: 12px; border: 2px solid #b7d6c2; display: inline-block; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

.actions { display: flex; align-items: center; gap: 10px; }
.count { font-size: 16px; font-weight: 800; color: #7a8d7f; min-width: 65px; text-align: center; font-variant-numeric: tabular-nums; background: #e5ede7; padding: 6px 12px; border-radius: 20px; margin-right: 4px; }
.action { border: 2px solid #cddbcf; border-radius: 16px; padding: 18px 24px; background: #edf2e8; color: #46695a; font-weight: 800; font-size: 17px; transition: 0.2s; }
.primary { background: var(--green); color: #fff; border-color: var(--green); min-width: 150px; box-shadow: 0 4px 12px rgba(70,117,102,0.3); }
.action:disabled { opacity: 0.4; background: #e0e0e0; border-color: #d0d0d0; color: #888; box-shadow: none; transform: none; }
button:hover:enabled { filter: brightness(0.95); transform: translateY(-2px); }
button:active:enabled { transform: translateY(0); }
.btn-icon { padding: 18px 20px; font-size: 20px; border-radius: 16px; }

.bottom { display: flex; align-items: center; justify-content: space-between; gap: 15px; border-top: 1px solid var(--line); padding-top: 14px; color: #889888; font-size: 13px; flex-wrap: wrap; }
kbd { font: inherit; border: 1px solid #d9e0d2; border-radius: 4px; padding: 2px 6px; background: #fff; }

@media(max-width: 900px) {
  .mode-toggle label { padding: 8px 12px; font-size: 13px; }
  .action { padding: 15px 18px; font-size: 15px; }
  .btn-icon { padding: 15px; font-size: 18px; }
}

/* 스마트폰 전용: 지도와 조작부를 한 화면에 표시 */
@media (max-width: 900px) and (orientation: portrait) {
  main { padding: 10px 10px 12px; width: 100%; }
  .top { gap: 8px; margin-bottom: 8px; }
  .kicker { font-size: 9px; margin-bottom: 2px; }
  h1 { font-size: 19px; }
  .settings { width: 100%; gap: 6px; justify-content: space-between; }
  .mode-toggle { flex: 1; min-width: 0; }
  .mode-toggle label { flex: 1; text-align: center; padding: 8px 2px; font-size: 10px; white-space: nowrap; }
  .small { padding: 8px 9px; font-size: 11px; }
  .map-frame { border-radius: 12px; }
  .map-scroll { overflow-x: hidden; }
  .town-wrap { min-width: 0; width: 100%; }
  #town { width: 100%; height: auto; }
  .panel { grid-template-columns: minmax(0,1fr); gap: 8px; padding: 10px 2px 8px; }
  .panel > div:first-child { min-width: 0; }
  .status { font-size: 12px; margin-bottom: 4px; overflow-wrap: anywhere; }
  .question { font-size: 23px; min-height: 30px; white-space: normal; overflow-wrap: normal; word-break: keep-all; }
  .actions { width: 100%; gap: 5px; flex-wrap: wrap; }
  .count { min-width: 52px; padding: 7px 5px; font-size: 12px; margin-right: auto; }
  .action { padding: 10px 9px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .btn-icon { padding: 9px; font-size: 16px; }
  .primary { min-width: 86px; }
  .bottom { padding-top: 8px; font-size: 10px; gap: 6px; }
}
@media (max-width: 1000px) and (orientation: landscape) and (max-height: 650px) {
  html, body { margin: 0; }
  main { padding: 4px 10px; max-width: none; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .top { flex: 0 0 auto; flex-wrap: nowrap; gap: 8px; margin-bottom: 4px; min-height: 31px; }
  .top > div:first-child { min-width: 0; flex-shrink: 1; }
  .kicker { display: none; }
  h1 { font-size: 15px; white-space: nowrap; }
  .settings { gap: 5px; flex-wrap: nowrap; }
  .mode-toggle label { padding: 6px 7px; font-size: 10px; white-space: nowrap; }
  .small { padding: 6px 8px; font-size: 10px; white-space: nowrap; }
  .map-frame { flex: 1 1 auto; min-height: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .map-scroll { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .town-wrap { min-width: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  #town { width: 100%; height: 100%; object-fit: contain; }
  .panel { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 2px; }
  .panel > div:first-child { min-width: 0; flex: 1 1 auto; }
  .status { font-size: 10px; margin-bottom: 1px; white-space: normal; }
  .question { font-size: 17px; min-height: 22px; white-space: nowrap; }
  .actions { flex: 0 0 auto; gap: 5px; }
  .count { font-size: 11px; min-width: 50px; padding: 5px; margin: 0; }
  .action { padding: 7px 9px; font-size: 11px; border-radius: 9px; white-space: nowrap; }
  .btn-icon { padding: 6px 8px; font-size: 14px; }
  .primary { min-width: 80px; }
  .bottom { flex: 0 0 auto; padding-top: 3px; gap: 4px; font-size: 9px; min-height: 17px; }
  .bottom kbd { padding: 0 3px; }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

const reduced = matchMedia('(prefers-reduced-motion: reduce)');

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nextIndex() { if (!bag.length) { bag = shuffle(places.map((_, i) => i)); if (bag.at(-1) === current) { [bag[0], bag[bag.length - 1]] = [bag.at(-1), bag[0]]; } } return bag.pop(); }

// 건물의 실제 간판 크기에 맞춰 강조 표시를 자동으로 생성합니다.
// 활성화된 목적지에서만 보이므로 듣고 찾기 정답을 미리 노출하지 않습니다.
(function installTargetMarkers() {
  const ns = 'http://www.w3.org/2000/svg';
  const make = (tag, attrs) => {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    return node;
  };
  document.querySelectorAll('.destination').forEach(place => {
    const sign = place.querySelector('.sign-face');
    if (!sign) return;
    const b = sign.getBBox();
    const x = b.x - 5, y = b.y - 5, w = b.width + 10, h = b.height + 10;
    const marker = make('g', {'class': 'target-marker', 'aria-hidden': 'true'});
    marker.appendChild(make('rect', {'class':'target-outline-white', x, y, width:w, height:h, rx:8}));
    marker.appendChild(make('rect', {'class':'target-outline-red', x, y, width:w, height:h, rx:8}));
    const center = b.x + b.width / 2;
    const tip = y - 10;
    const arrow = make('path', {'class':'target-arrow', d:`M ${center-15} ${tip-28} H ${center+15} V ${tip-16} H ${center+24} L ${center} ${tip+1} L ${center-24} ${tip-16} H ${center-15} Z`});
    marker.appendChild(arrow);
    place.appendChild(marker);
  });
})();

function clearMap() { document.querySelectorAll('.destination').forEach(el => el.classList.remove('active', 'revealed')); }

function follow(p) { if (window.matchMedia('(max-width: 900px) and (orientation: portrait), (max-width: 1000px) and (orientation: landscape) and (max-height: 650px)').matches) return; const box = $('mapScroll'), w = $('town').getBoundingClientRect().width; const x = (p.signX + 46) / 1600 * w; box.scrollTo({ left: Math.max(0, x - box.clientWidth / 2), behavior: reduced.matches ? 'auto' : 'smooth' }); }

const UPPER_WALK = 355, LOWER_WALK = 466, SHOP_FRONT = 734;
const CROSSWALKS = [319, 1210];

function routeTo(target) {
  const points = [];
  const push = (x, y) => { const last = points.at(-1) || { x: walkerX, y: walkerY }; if (Math.hypot(x - last.x, y - last.y) > .1) points.push({ x, y }); };
  const origin = arrivedAt;
  if (origin && origin.side === 'down' && target.side === 'down') { push(origin.x, SHOP_FRONT); push(target.x, SHOP_FRONT); push(target.x, target.doorY); return points; }
  if (origin) { if (origin.side === 'down') { push(origin.x, SHOP_FRONT); push(origin.lane, SHOP_FRONT); push(origin.lane, LOWER_WALK); } else push(origin.x, UPPER_WALK); }
  const startSide = origin ? origin.side : 'up';
  const exitX = points.at(-1)?.x ?? walkerX;
  const targetLane = target.side === 'up' ? target.x : target.lane;
  if (startSide !== target.side) {
    const crossing = CROSSWALKS.reduce((best, x) => Math.abs(exitX - x) + Math.abs(targetLane - x) < Math.abs(exitX - best) + Math.abs(targetLane - best) ? x : best);
    push(crossing, startSide === 'up' ? UPPER_WALK : LOWER_WALK);
    push(crossing, target.side === 'up' ? UPPER_WALK : LOWER_WALK);
  }
  if (target.side === 'down') { push(target.lane, LOWER_WALK); push(target.lane, SHOP_FRONT); push(target.x, SHOP_FRONT); } else push(target.x, UPPER_WALK);
  push(target.x, target.doorY);
  return points;
}

// 8비트 걷기 소리 발생 함수
function playWalkBeep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'square'; // 레트로한 8비트 사운드
  // 발을 디딜 때마다 약간의 음높이 변화를 주어 걷는 느낌 연출
  osc.frequency.setValueAtTime(walkToggle ? 400 : 500, audioCtx.currentTime);
  walkToggle = !walkToggle;
  
  // 소리 크기 조절 (너무 크지 않게)
  gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.1);
}

function startWalkSound() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  walkToggle = false;
  playWalkBeep();
  walkInterval = setInterval(playWalkBeep, 250); // 걷는 애니메이션 템포에 맞춤
}

function stopWalkSound() {
  if (walkInterval) {
    clearInterval(walkInterval);
    walkInterval = null;
  }
}

function travel(target) {
  const route = routeTo(target);
  const nodes = [{ x: walkerX, y: walkerY }, ...route];
  const lengths = route.map((p, i) => Math.hypot(p.x - nodes[i].x, p.y - nodes[i].y));
  const total = lengths.reduce((a, b) => a + b, 0);
  const duration = reduced.matches ? 0 : Math.max(350, Math.min(2600, total * 1.7));
  const position = (x, y) => { walkerX = x; walkerY = y; walker.setAttribute('transform', `translate(${x} ${y})`); };
  
  return new Promise(resolve => {
    if (!total || !duration) { position(target.x, target.doorY); resolve(); return; }
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      let distance = total * t, index = 0;
      while (index < lengths.length - 1 && distance > lengths[index]) { distance -= lengths[index]; index++; }
      const amount = Math.min(1, distance / lengths[index]);
      
      const newX = nodes[index].x + (nodes[index + 1].x - nodes[index].x) * amount;
      const newY = nodes[index].y + (nodes[index + 1].y - nodes[index].y) * amount;
      
      if (newX - walkerX > 0.5) walker.classList.remove('facing-left');
      else if (newX - walkerX < -0.5) walker.classList.add('facing-left');

      position(newX, newY);
      
      if (t < 1) requestAnimationFrame(step); 
      else { position(target.x, target.doorY); resolve(); }
    }
    requestAnimationFrame(step);
  });
}

const placeAudioNames = {"학교":"school","숙소":"lodging","도서관":"library","병원":"hospital","약국":"pharmacy","공원":"park","시장":"market","은행":"bank","우체국":"postoffice","미용실":"salon","식당":"restaurant","커피숍":"cafe","영화관":"cinema","편의점":"convenience","이발소":"barbershop"};
const audioPlayer = new Audio();
let speechRequest = 0;
function speak(text) {
  const request = ++speechRequest;
  audioPlayer.pause();
  audioPlayer.onended = null;
  audioPlayer.currentTime = 0;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const key = text.trim() === '어디에 가요?' ? 'question'
    : placeAudioNames[text.trim().replace(/에 가요\.$/, '')];
  const fallback = () => {
    if (request !== speechRequest || !('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.95;
    speechSynthesis.speak(u);
  };
  if (!key || !embeddedAudio[key]) { fallback(); return; }
  audioPlayer.onerror = fallback;
  audioPlayer.src = 'data:audio/mpeg;base64,' + embeddedAudio[key];
  audioPlayer.play().catch(fallback);
}


// 듣고 찾기: 남성 질문을 끝까지 재생한 뒤 여성 대답 재생
function speakListenPair() {
  if (current < 0) return;
  speak('어디에 가요?');
  const questionRequest = speechRequest;
  audioPlayer.onended = () => {
    if (speechRequest !== questionRequest || gameState !== 'waiting_move') return;
    speak(places[current].name + '에 가요.');
  };
}

  if (mode !== 'speaking' || gameState !== 'arrived' || current < 0) return;
  if (!SpeechRecognitionClass) {
    $('status').textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome에서 열어 주세요.';
    return;
  }
  stopRecognition();
  const token = speakingToken;
  const r = new SpeechRecognitionClass();
  recognizer = r;
  r.lang = 'ko-KR'; r.interimResults = false; r.continuous = false; r.maxAlternatives = 5;
  micBtn.textContent = '🎙️ 듣는 중...';
  $('status').textContent = '마이크에 대고 한국어로 대답해 보세요.';
  r.onresult = e => {
    if (token !== speakingToken || gameState !== 'arrived' || mode !== 'speaking') return;
    const expected = normalizeKorean(places[current].name + '에 가요.');
    const heard = Array.from(e.results[0]).map(x => x.transcript);
    const correct = heard.some(t => normalizeKorean(t) === expected);
    if (correct) {
      $('status').textContent = '잘했어요!';
      $('status').className = 'status state-c';
      micBtn.disabled = true;
      gameState = 'speaking_success';
      $('question').innerHTML = `<span class="answer-card">${places[current].name}에 가요.</span>`;
      moveBtn.disabled = false;
      moveBtn.textContent = '🚶 다음 장소';
      setTimeout(() => { if (mode === 'speaking' && gameState === 'speaking_success') moveBtn.click(); }, 1400);
    } else {
      $('status').textContent = '다시 말해 보세요. (인식: ' + (heard[0] || '') + ')';
      $('status').className = 'status state-b';
      micBtn.textContent = '🎤 다시 말하기';
    }
  };
  r.onerror = e => {
    if (token !== speakingToken || gameState !== 'arrived') return;
    micBtn.textContent = '🎤 다시 말하기';
    $('status').textContent = (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      ? '음성 인식이 차단되었습니다 (' + e.error + '). Chrome 사이트 권한 또는 Google Apps Script 실행 환경을 확인해 주세요.'
      : e.error === 'no-speech' ? '음성이 들리지 않았습니다. 다시 말해 보세요.'
      : '음성 인식 오류: ' + e.error;
  };
  r.onend = () => {
    if (token === speakingToken && gameState === 'arrived') micBtn.textContent = '🎤 다시 말하기';
  };
  try { r.start(); } catch(e) { $('status').textContent = '음성 인식 시작 오류: ' + (e.name || 'Unknown') + ' - ' + (e.message || '다시 시도해 주세요.'); }
}
micBtn.addEventListener('click', startRecognition);

async function handleMainBtn() {
  // 오디오 컨텍스트 초기화 (사용자 인터랙션 시 필수)
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (gameState === 'moving') return;

  if (gameState === 'idle' || gameState === 'revealed' || gameState === 'speaking_success') {
    stopRecognition();
    if (mode === 'listen') {
      current = nextIndex();
      clearMap();
      gameState = 'waiting_move';
      speakListenPair();
      moveBtn.innerHTML = '🚶 출발!';
      $('status').innerHTML = '장소를 추측했나요? 출발을 눌러 확인해 보세요.';
      $('status').className = 'status state-a';$('question').innerHTML = '어디에 가요?';
      speakBtn.disabled = false;
      revealBtn.disabled = true;
    } else {
      current = nextIndex();
      clearMap();
      await executeMove(places[current]);
    }
  } else if (gameState === 'waiting_move') {
    await executeMove(places[current]);
  }
}

async function executeMove(p) {
  gameState = 'moving';
  moveBtn.disabled = true;
  revealBtn.disabled = true;
  speakBtn.disabled = true;
  micBtn.disabled = true;

  $('question').innerHTML = '어디에 가요?';
  $('status').innerHTML = '목적지로 이동 중이에요...';
  $('status').className = 'status state-a';
  moveBtn.innerHTML = '이동 중...';

  walker.classList.add('walking');
  if (!reduced.matches) startWalkSound(); // 애니메이션 감소 설정이 아닐 때만 소리 재생
  
  follow(p);
  await travel(p);
  
  stopWalkSound(); // 이동 완료 후 소리 끄기
  arrivedAt = p;
  walker.classList.remove('walking');
  $('place-' + current).classList.add('active');
  
  visits++;
  let cycleNum = (visits % places.length === 0) ? places.length : (visits % places.length);
  $('count').textContent = cycleNum + ' / ' + places.length;

  if (mode === 'listen') {
    doReveal();
  } else {
    gameState = 'arrived';
    $('status').innerHTML = '장소를 보고 <strong>먼저 말해 보세요.</strong>';
    $('status').className = 'status state-b';
    revealBtn.disabled = mode === 'speaking';
    speakBtn.disabled = false;
    micBtn.disabled = mode !== 'speaking';
    moveBtn.disabled = true; 
    moveBtn.innerHTML = '🚶 다음 장소';
    speak('어디에 가요?'); // 목적지에 도착하면 질문을 자동으로 읽습니다.
    if (mode === 'speaking') {
      $('status').textContent = '질문을 들은 후 🎤 말하기 버튼을 눌러 대답해 보세요.';
      // 브라우저 보안 정책상 자동 마이크 실행이 차단될 수 있어,
      // 음성 인식은 사용자가 마이크 버튼을 직접 누를 때만 시작합니다.
    }
  }
}

function doReveal() {
  if (current < 0) return;
  gameState = 'revealed';
  const p = places[current];
  $('place-' + current).classList.add('revealed');
  
  speak(p.name + "에 가요.");
  
  $('question').innerHTML = `<span class="answer-card">${p.name}에 가요.</span>`;
  
  if (visits > 0 && visits % places.length === 0) {
    $('status').innerHTML = `🎉 <strong>${places.length}곳 모두 방문했어요!</strong> 다음은 새로운 순서로 시작됩니다.`;
  } else {
    $('status').innerHTML = '정답을 확인하고, 문장으로 한 번 더 말해 보세요.';
  }
  $('status').className = 'status state-c';
  
  revealBtn.disabled = true;
  speakBtn.disabled = false;
  moveBtn.disabled = false;
  
  moveBtn.innerHTML = (mode === 'listen') ? '🔊 다음 문제 듣기' : '🚶 다음 장소';
}

moveBtn.addEventListener('click', handleMainBtn);
revealBtn.addEventListener('click', doReveal);

// 화면의 질문을 눌러도 다시 들을 수 있습니다.
$('question').addEventListener('click', () => {
  if ($('question').textContent.trim() === '어디에 가요?') speak('어디에 가요?');
});

speakBtn.addEventListener('click', () => {
  if (current < 0) return;
  if (gameState === 'waiting_move') {
    speakListenPair();
  } else if (gameState === 'revealed') {
    speak(places[current].name + "에 가요.");
  } else if (gameState === 'arrived') {
    speak("어디에 가요?");
  }
});

document.querySelectorAll('input[name="gameMode"]').forEach(radio => {
  radio.addEventListener('change', e => {
    stopRecognition();
    mode = e.target.value;
    micBtn.style.display = mode === 'speaking' ? '' : 'none';
    revealBtn.style.display = mode === 'speaking' ? 'none' : '';
    if (gameState === 'arrived') { micBtn.disabled = mode !== 'speaking'; revealBtn.disabled = mode === 'speaking'; }
    document.body.className = 'mode-' + mode;
    
    if (gameState === 'idle' || gameState === 'revealed' || gameState === 'speaking_success') {
      moveBtn.innerHTML = (mode === 'listen') ? '🔊 문제 듣기' : '🚶 출발!';
      if (mode === 'listen' && gameState === 'idle') {
        $('status').innerHTML = '문제 듣기 버튼을 누르고 도착지를 추측해 보세요.';
      } else if (gameState === 'idle') {
        $('status').innerHTML = '출발 버튼을 눌러보세요.';
      }
    }
  });
});

document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.target.matches('input,textarea,select') || e.target.isContentEditable) return;
  
  if (e.key === 'Enter') { e.preventDefault(); if (!moveBtn.disabled) moveBtn.click(); }
  else if (e.code === 'Space' && !e.target.matches('button')) { e.preventDefault(); if (!revealBtn.disabled) revealBtn.click(); }
  else if (e.key.toLowerCase() === 'l') { e.preventDefault(); if (!speakBtn.disabled) speakBtn.click(); }
});

$('fullscreenBtn').addEventListener('click', async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } 
  catch { $('status').textContent = '전체 화면을 지원하지 않는 환경입니다.'; }
});
document.addEventListener('fullscreenchange', () => { $('fullscreenBtn').textContent = document.fullscreenElement ? '전체 화면 닫기' : '전체 화면'; });
if (!document.documentElement.requestFullscreen) $('fullscreenBtn').hidden = true;
</script>
</body>
